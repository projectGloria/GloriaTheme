<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="50%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#00ff41" />
    </linearGradient>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#091424" />
      <stop offset="70%" stop-color="#03070e" />
      <stop offset="100%" stop-color="#010307" />
    </radialGradient>
  </defs>

  <!-- Outer ring & backdrop -->
  <circle cx="64" cy="64" r="60" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="2.5" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="#00ffff" stroke-opacity="0.25" stroke-dasharray="4 3" />

